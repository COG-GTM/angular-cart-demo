name: container-image

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install -g bower@1.8.14 grunt-cli@1.5.0
      - run: bower install
      - name: Existing tests (server mocha + client karma)
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_INTERNAL_REGISTRY: ${{ secrets.INTERNAL_REGISTRY_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: angular-cart-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to internal registry
        if: github.event_name == 'push' && env.HAS_INTERNAL_REGISTRY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
      - name: Push to internal registry
        if: github.event_name == 'push' && env.HAS_INTERNAL_REGISTRY == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.INTERNAL_REGISTRY_URL }}/angular-cart-demo:${{ github.sha }}
          cache-from: type=gha
