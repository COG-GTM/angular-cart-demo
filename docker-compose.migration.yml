# Local stack for the app migration wave: app + its real datastore (MongoDB) + MinIO standing in for S3.
# Secrets come from the shell environment by name only, e.g.
#   export SESSION_SECRET=... MINIO_ROOT_USER=... MINIO_ROOT_PASSWORD=...
#   docker compose -f docker-compose.migration.yml up -d --build
services:
  web:
    build: .
    image: angular-cart-demo:migration
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017/angularclothesshop
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the shell}
      seedDB: "yes"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the shell}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the shell}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
